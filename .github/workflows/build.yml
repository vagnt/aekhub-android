name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | grep -v "^> Task" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Rename APK
        run: |
          V=$(grep versionName app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "AEKHub-$V-build${{ github.run_number }}.apk"
          echo "APK=AEKHub-$V-build${{ github.run_number }}.apk" >> $GITHUB_ENV
          echo "VER=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AEK Hub ${{ env.VER }} (build ${{ github.run_number }})
          prerelease: true
          files: ${{ env.APK }}
